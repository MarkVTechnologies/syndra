[build]
  # Monorepo (Turborepo + pnpm workspaces) — install from the repo root so
  # workspace:* deps between frontend/ and backend/*/ resolve correctly,
  # then build only the frontend package. Mirrors frontend/vercel.ts's
  # buildCommand/installCommand pattern for the Vercel target.
  command = "pnpm install --frozen-lockfile && pnpm turbo run build --filter=@san/frontend"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  # frontend/middleware.ts sets a nonce-based CSP the way Next.js's own docs
  # describe (generate a nonce, forward it via an x-nonce request header,
  # Next auto-attaches it to the framework scripts it injects) — but that
  # mechanism requires dynamic rendering to work, per Next's own
  # documentation, and several of this app's pages (marketing home, all
  # auth screens) are statically rendered. Vercel's own hosting has
  # special-cased handling that makes this combination work anyway; generic
  # standalone-output hosts don't replicate it, so on Netlify every script
  # tag rendered on a static page carries no nonce attribute at all, and
  # 'strict-dynamic' then blocks every single one of them silently (no
  # console error, no visible failure beyond "nothing on the page works") —
  # this is what broke every login form. This plugin runs as an edge
  # function that generates its own per-request nonce, rewrites the HTML to
  # attach it to script tags, and merges its own CSP header with whatever
  # the app's middleware already set (both nonces end up listed as valid
  # script-src sources — the app's own nonce ends up unused but harmless).
  package = "@netlify/plugin-csp-nonce"

[functions]
  # Netlify's own function bundler (esbuild-based) repackages Next's server
  # output for Lambda and does not consult Next's own `serverExternalPackages`
  # (frontend/next.config.ts) — that setting only governs Next's webpack
  # build, not Netlify's post-build repackaging step. Without this, esbuild
  # tries to inline these and breaks in two different ways: mongoose ends up
  # duplicated (a second bundled copy alongside the real one, which breaks
  # Mongoose's internal Schema.Types.ObjectId identity checks — the
  # "Cannot read properties of undefined (reading '_id')" crash), and
  # @node-rs/argon2's native .node binary can't be inlined by esbuild at all
  # (a native addon, not source it can parse), so it's silently dropped
  # ("Cannot find module '@node-rs/argon2'" at runtime, breaking login).
  external_node_modules = ["mongoose", "@node-rs/argon2", "@node-rs/argon2-linux-x64-gnu"]
